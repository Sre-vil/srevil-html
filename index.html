<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Srevil Intro Demo</title>
<noscript><meta http-equiv="refresh" content="0; url=/gallery/"></noscript>
<style>
  :root {
    --bg: #0b0b0f;
    --fg: #f3f1ec;
    --muted: #8b8a93;
    --claude: #d97757;
    --grok: #ffffff;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }

  /* JS 없이 열었을 때 보이는 갤러리 링크 */
  .nojs { position: fixed; left: 50%; top: 50%; transform: translate(-50%, 120px); z-index: 10001; color: var(--fg); font-size: 15px; }

  /* ================= INTRO OVERLAY ================= */
  #intro {
    position: fixed; inset: 0; z-index: 9999;
    background: radial-gradient(ellipse at 50% 60%, #17161d 0%, var(--bg) 70%);
    color: var(--fg);
    display: grid; place-items: center;
    overflow: hidden;
    transition: opacity .7s ease, transform .9s cubic-bezier(.7,0,.2,1);
  }
  #intro.leave { opacity: 0; transform: translateY(-6%); pointer-events: none; }

  /* 별 배경 */
  #stars { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; animation: fadeIn 1.2s ease forwards; }

  .stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 36px; }
  .duo { position: relative; display: flex; align-items: center; justify-content: center; gap: 28px; height: 140px; }

  .icon { width: 112px; height: 112px; position: relative; will-change: transform; }
  .icon svg, .icon img { width: 100%; height: 100%; display: block; }

  /* Grok bot: 타일은 왼쪽에서 미끄러져 들어오고, 안의 공은 굴러 들어옴 */
  .icon.grok {
    opacity: 0;
    animation:
      grokIn 1s cubic-bezier(.2,.9,.25,1.15) .5s forwards,
      bump-left .35s ease-out 1.55s;
  }
  .icon.grok .gb-body {
    transform-box: fill-box; transform-origin: center;
    animation: gbRoll 1s cubic-bezier(.2,.9,.25,1.1) .5s both, gbSquish .5s ease-out 1.55s;
  }
  /* 눈: 깜빡임 + 만난 뒤 Claude 쪽을 한 번 흘끗 */
  .icon.grok .gb-eyes {
    transform-box: fill-box; transform-origin: center;
    animation: gbLook 1.2s ease-in-out 2.1s both, blink 3.4s steps(1) 2.9s infinite;
  }
  /* Claude Code: 오른쪽에서 통통 튀며 진입 */
  .icon.claude {
    opacity: 0;
    animation:
      claudeIn 1s cubic-bezier(.3,.7,.3,1) .65s forwards,
      bump-right .35s ease-out 1.55s;
  }
  .icon.claude .eye { animation: blink 3s steps(1) 2.4s infinite; transform-origin: center; transform-box: fill-box; }

  /* 두 아이콘이 만날 때 터지는 스파크 */
  .spark {
    position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
    border-radius: 50%; background: #fff; opacity: 0;
    box-shadow: 0 0 24px 8px rgba(217,119,87,.8), 0 0 60px 20px rgba(255,255,255,.25);
    animation: spark .7s ease-out 1.6s forwards;
  }
  .ring {
    position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px;
    border: 2px solid rgba(255,255,255,.7); border-radius: 50%; opacity: 0;
    animation: ring .9s ease-out 1.6s forwards;
  }
  .x { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font: 600 22px var(--mono); color: var(--muted); opacity: 0; animation: fadeIn .3s ease 1.6s forwards, fadeOut .3s ease 2.1s forwards; }

  /* 터미널 타이핑 */
  .term { font-family: var(--mono); text-align: center; min-height: 72px; }
  .term .line { font-size: clamp(22px, 6vw, 40px); font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
  .term .prompt { color: var(--claude); margin-right: .4em; }
  .term .cursor { display: inline-block; width: .55em; height: 1em; vertical-align: -.12em; background: var(--fg); margin-left: 2px; animation: caret 1s steps(1) infinite; }
  .term .tagline { margin-top: 10px; font-size: 14px; color: var(--muted); opacity: 0; transform: translateY(6px); transition: all .5s ease; }
  .term .tagline.show { opacity: 1; transform: none; }

  .skip {
    position: absolute; right: 16px; bottom: 16px;
    background: transparent; color: var(--muted); border: 1px solid #2a2930; border-radius: 999px;
    padding: 6px 14px; font: 12px var(--mono); cursor: pointer;
  }
  .skip:hover { color: var(--fg); border-color: #444; }

  @keyframes fadeIn  { to { opacity: 1; } }
  @keyframes fadeOut { to { opacity: 0; } }
  @keyframes grokIn {
    0%   { opacity: 0; transform: translateX(-60vw) scale(.8); }
    100% { opacity: 1; transform: translateX(0) scale(1); }
  }
  @keyframes gbRoll  { 0% { transform: rotate(-540deg); } 100% { transform: rotate(0); } }
  @keyframes gbSquish { 30% { transform: scale(1.08, .9); } 60% { transform: scale(.96, 1.04); } }
  @keyframes gbLook  { 0%, 100% { transform: translate(0, 0); } 30%, 70% { transform: translate(3px, 1px); } }
  @keyframes claudeIn {
    0%   { opacity: 0; transform: translateX(60vw) translateY(0); }
    25%  { opacity: 1; transform: translateX(36vw) translateY(-40px); }
    45%  { transform: translateX(18vw) translateY(0); }
    65%  { transform: translateX(6vw) translateY(-24px); }
    85%  { transform: translateX(0) translateY(0) scaleY(.88); }
    100% { opacity: 1; transform: translateX(0) translateY(0) scaleY(1); }
  }
  @keyframes bump-left  { 50% { transform: translateX(10px) scale(1.06); } }
  @keyframes bump-right { 50% { transform: translateX(-10px) scale(1.06); } }
  @keyframes spark { 0% { opacity: 0; transform: scale(.2); } 30% { opacity: 1; transform: scale(1.6); } 100% { opacity: 0; transform: scale(.4); } }
  @keyframes ring  { 0% { opacity: .9; transform: scale(.3); } 100% { opacity: 0; transform: scale(5); } }
  @keyframes blink { 0%, 92% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }
  @keyframes caret { 50% { opacity: 0; } }

  @media (max-width: 480px) {
    .icon { width: 84px; height: 84px; }
    .duo { gap: 20px; height: 110px; }
  }

  /* 모션 최소화 설정을 존중: 애니메이션 없이 바로 보여줌 */
  @media (prefers-reduced-motion: reduce) {
    .icon.grok, .icon.claude, #stars, .gb-body, .gb-eyes { animation: none; opacity: 1; }
    .spark, .ring, .x { display: none; }
  }
</style>
</head>
<body>

<!-- ================= INTRO OVERLAY =================
     실제 아이콘 이미지가 있으면 각 .icon 안의 <svg>를
     <img src="/assets/img/grok.png" alt="Grok"> 처럼 교체하면 됩니다. -->
<div id="intro" aria-hidden="true">
  <canvas id="stars"></canvas>

  <div class="stage">
    <div class="duo">
      <!-- Grok bot (하얀 공 캐릭터, SVG) -->
      <div class="icon grok">
        <svg viewBox="19 25 62 62" overflow="visible" aria-label="Grok bot">
          <defs>
            <linearGradient id="gbBg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#cfe3fb"/>
              <stop offset=".35" stop-color="#7fb2ef"/>
              <stop offset="1" stop-color="#5d9ae6"/>
            </linearGradient>
            <radialGradient id="gbGlow" cx=".35" cy=".05" r=".7">
              <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
              <stop offset="1" stop-color="#fff" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="gbBall" cx=".4" cy=".35" r=".75">
              <stop offset="0" stop-color="#ffffff"/>
              <stop offset=".8" stop-color="#f7f9fd"/>
              <stop offset="1" stop-color="#dfe8f6"/>
            </radialGradient>
            <filter id="gbShadow" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#8fbcf5" flood-opacity=".45"/>
            </filter>
          </defs>
          <g class="gb-body">
            <circle cx="50" cy="56" r="27" fill="url(#gbBall)" filter="url(#gbShadow)"/>
            <g class="gb-eyes">
              <rect x="54.5" y="40" width="5.5" height="12" rx="2.75" fill="#111" transform="rotate(-28 57.25 46)"/>
              <rect x="64.5" y="40" width="5.5" height="12" rx="2.75" fill="#111" transform="rotate(-28 67.25 46)"/>
            </g>
          </g>
        </svg>
      </div>

      <span class="x">×</span>
      <div class="ring"></div>
      <div class="spark"></div>

      <!-- Claude Code 마스코트 (임시 픽셀 SVG) -->
      <div class="icon claude">
        <svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-label="Claude Code">
          <rect x="3" y="3" width="10" height="7" fill="#d97757"/>
          <rect x="1" y="6" width="2" height="2" fill="#d97757"/>
          <rect x="13" y="6" width="2" height="2" fill="#d97757"/>
          <rect class="eye" x="5" y="5" width="1" height="2" fill="#000"/>
          <rect class="eye" x="10" y="5" width="1" height="2" fill="#000"/>
          <rect x="4" y="10" width="1" height="3" fill="#d97757"/>
          <rect x="6" y="10" width="1" height="3" fill="#d97757"/>
          <rect x="9" y="10" width="1" height="3" fill="#d97757"/>
          <rect x="11" y="10" width="1" height="3" fill="#d97757"/>
        </svg>
      </div>
    </div>

    <div class="term">
      <div class="line"><span class="prompt">&gt;</span><span id="typed"></span><span class="cursor"></span></div>
      <div class="tagline" id="tagline">기록하고 정리하는 블로그</div>
    </div>
  </div>

  <button class="skip" id="skip" type="button">skip ↵</button>
</div>

<noscript><a class="nojs" href="/gallery/">갤러리로 이동 →</a></noscript>

<script>
(function () {
  var TITLE = "Srevil Blog";
  var NEXT = "/gallery/";          // 인트로가 끝나면 이동할 곳
  var done = false;
  var intro = document.getElementById("intro");
  var typed = document.getElementById("typed");
  var tagline = document.getElementById("tagline");
  var timers = [];
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---- 별 배경 ---- */
  var canvas = document.getElementById("stars");
  var ctx = canvas.getContext("2d");
  var stars = [], raf;
  function resize() {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({ length: Math.round(innerWidth * innerHeight / 6000) }, function () {
      return { x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 1.2 + .2, s: Math.random() * .3 + .05, p: Math.random() * 6.28 };
    });
  }
  function draw(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.y -= s.s; if (s.y < 0) s.y = innerHeight;
      ctx.globalAlpha = .35 + .35 * Math.sin(t / 700 + s.p);
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
    }
    raf = requestAnimationFrame(draw);
  }

  /* ---- 시퀀스 ---- */
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

  function typeTitle(startMs) {
    for (var i = 1; i <= TITLE.length; i++) {
      (function (n) { later(function () { typed.textContent = TITLE.slice(0, n); }, startMs + n * 70); })(i);
    }
    return startMs + TITLE.length * 70;
  }

  function go() { location.replace(NEXT); }

  // 자연 종료 / skip / 클릭 / 키 입력 모두 여기로: 페이드아웃(.7s) 후 갤러리로 이동
  function finish() {
    if (done) return;
    done = true;
    timers.forEach(clearTimeout); timers = [];
    intro.classList.add("leave");
    later(go, 700);
  }

  function play() {
    resize(); raf = requestAnimationFrame(draw);

    if (reduce) {                           // 모션 최소화: 애니메이션 생략하고 곧바로 이동
      done = true;
      typed.textContent = TITLE; tagline.classList.add("show");
      later(go, 300);
      return;
    }
    var end = typeTitle(2100);              // 만난 직후부터 타이핑
    later(function () { tagline.classList.add("show"); }, end + 150);
    later(finish, end + 1300);              // 총 약 4.2초
  }

  document.getElementById("skip").addEventListener("click", finish);
  intro.addEventListener("click", function (e) { if (e.target.id !== "skip") finish(); });
  document.addEventListener("keydown", function (e) { finish(); });
  addEventListener("resize", resize);
  play();
})();
</script>
<style>.srv-gl{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:10000;padding:7px 15px;border-radius:999px;white-space:nowrap;font:500 13px/1.2 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;letter-spacing:-.01em;text-decoration:none;color:rgba(243,241,236,.78);background:rgba(255,255,255,.07);-webkit-backdrop-filter:saturate(160%) blur(12px);backdrop-filter:saturate(160%) blur(12px);border:1px solid rgba(255,255,255,.14);transition:color .2s ease,background .2s ease,border-color .2s ease}.srv-gl:hover{color:#fff;background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.26)}.srv-gl:focus-visible{outline:2px solid #d97757;outline-offset:3px}</style><a class="srv-gl" href="/gallery/">갤러리 보기 →</a>
</body>
</html>
